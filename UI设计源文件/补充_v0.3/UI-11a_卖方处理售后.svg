<text x="324" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">我的商品</text>
<text x="454" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">交易方案</text>
<text x="584" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">付款与交付</text>
<text x="754" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">售后服务</text>
<line x1="754" y1="78" x2="818" y2="78" stroke="#171717" stroke-width="2"/>
<text x="1220" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="end">邮箱已验证</text>
<text x="1360" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="end">林同学</text>
<text x="80" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">处理售后申请</text>
<text x="80" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">A20261105001 · 待卖方处理 · 原订单已完成</text>
<rect x="80" y="230" width="800" height="826" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">买方申请</text>
<text x="108" y="327" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#171717" text-anchor="start">周同学 · 高等数学教材（上册）</text>
<text x="108" y="370" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">申请退 1 件 · 原单价 ¥10.00 · 预计退款 ¥10.00</text>
<text x="108" y="408" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">原订单 O20261104001 · 购买3件，共¥30.00</text>
<line x1="108" y1="448" x2="852" y2="448" stroke="#E7E7E7" stroke-width="1"/>
<text x="108" y="492" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">原因与证据</text>
<text x="108" y="533" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">收到后发现部分内页破损，希望退回其中1件。</text>
<rect x="108" y="560" width="144" height="108" rx="12" fill="#E7EEE3"/>
<g transform="translate(121.0909090909091 569.8181818181819) scale(0.4909090909090909)">
<rect x="54" y="19" width="147" height="160" rx="9" fill="#CCD9C8"/>
<rect x="42" y="7" width="147" height="160" rx="9" fill="#527B60"/>
<rect x="42" y="7" width="12" height="160" rx="5" fill="#3D604A"/>
<rect x="65" y="32" width="100" height="3" rx="1" fill="#BCD0BB"/>
<text x="69" y="65" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">高等数学</text>
<text x="70" y="90" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#DFE9DC" text-anchor="start">上册</text>
<path d="M68 135 Q90 101 110 125 T169 111" fill="none" stroke="#D7E7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="69" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#D7E7CC" text-anchor="start">MATHEMATICS</text>
</g>
<g transform="translate(121.0909090909091 569.8181818181819) scale(0.4909090909090909)">
<path d="M177 145 l10 4 M176 151 l9 3 M180 157 l6 2" fill="none" stroke="#E2D6B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="181" cy="152" r="20" fill="none" stroke="#A76825" stroke-width="2"/>
</g>
<line x1="108" y1="708" x2="852" y2="708" stroke="#E7E7E7" stroke-width="1"/>
<text x="108" y="753" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">双方沟通</text>
<text x="108" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">周同学  11月5日09:00：已补充问题图片。</text>
<rect x="108" y="824" width="744" height="74" rx="7" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="122" y="853" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">请填写需要向买方说明的内容</text>
<rect x="704" y="918" width="148" height="40" rx="9" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="778.0" y="944.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#303030" text-anchor="middle">发送留言</text>
<rect x="912" y="230" width="448" height="826" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="940" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#171717" text-anchor="start">答复申请</text>
<text x="940" y="330" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">提交：11月5日 09:00</text>
<text x="940" y="368" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">答复截止：11月7日 09:00</text>
<text x="940" y="406" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">卖方应在48小时内答复。</text>
<rect x="940" y="478" width="392" height="78" rx="7" fill="#F5F5F5"/>
<text x="956" y="508" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">同意后进入待退货，</text>
<text x="956" y="535" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">不直接向买方退款。</text>
<rect x="940" y="607" width="392" height="48" rx="9" fill="#171717"/>
<text x="1136.0" y="637.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">同意退货</text>
<text x="940" y="708" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">拒绝原因</text>
<rect x="940" y="726" width="392" height="100" rx="7" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="954" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">拒绝时必须填写具体原因</text>
<rect x="940" y="850" width="392" height="44" rx="9" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="1136.0" y="878.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#303030" text-anchor="middle">提交拒绝答复</text>
<text x="940" y="967" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">拒绝或超时后，由买方申请介入。</text>
<line x1="80" y1="1138" x2="1360" y2="1138" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1162" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
</svg>
