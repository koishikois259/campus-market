<text x="286" y="386" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">¥10.00 × 3 件 · 卖家：林同学</text>
<text x="286" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">O20261104001</text>
<line x1="108" y1="480" x2="832" y2="480" stroke="#E7E7E7" stroke-width="1"/>
<text x="108" y="526" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">进入待付款：11月4日 14:20</text>
<text x="108" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">付款截止：11月4日 14:50</text>
<text x="108" y="610" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">交付：平台代交 · 付款后才可取件</text>
<text x="108" y="721" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">普通取消申请不暂停付款期限。</text>
<rect x="892" y="228" width="468" height="558" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<rect x="920" y="254" width="106" height="28" rx="7" fill="#F5F5F5"/>
