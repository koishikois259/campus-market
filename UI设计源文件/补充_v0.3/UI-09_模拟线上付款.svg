<rect x="920" y="557" width="412" height="50" rx="9" fill="#171717"/>
<text x="1126.0" y="588.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">模拟付款 ¥30.00</text>
<text x="920" y="650" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">模拟结果不代表真实扣款。</text>
<text x="920" y="719" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#171717" text-anchor="start">查看付款与结算反馈 →</text>
<text x="80" y="852" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">付款成功后，可在原订单中查看交付进度。</text>
