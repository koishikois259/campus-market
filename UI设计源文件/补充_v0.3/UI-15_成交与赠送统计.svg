<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<title>成交 退款 净额与赠送统计</title>
<desc>校园二手交易系统补充模块初稿，白底黑字和彩色商品图。待审查，非真实业务。</desc>
<rect x="0" y="0" width="1440" height="1100" rx="0" fill="#FFFFFF"/>
<line x1="80" y1="79" x2="1360" y2="79" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#171717" text-anchor="start">校园集市</text>
<text x="310" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">商品审核</text>
<text x="456" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">举报与异常</text>
<text x="634" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">权限与分配</text>
<text x="812" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">统计与日志</text>
<line x1="812" y1="78" x2="892" y2="78" stroke="#171717" stroke-width="2"/>
<text x="1220" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="end">管理员</text>
<text x="1360" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="end">许老师</text>
<text x="80" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">成交与赠送统计</text>
<text x="80" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">原成交保留，成功退货退款另列。</text>
<text x="80" y="242" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">完成时间</text>
<rect x="80" y="258" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="94" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2026-11-04 至 2026-11-05</text>
<text x="456" y="242" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">卖家</text>
<rect x="456" y="258" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="470" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">林同学                         ▾</text>
<text x="780" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">范围：管理员可查询全平台</text>
<rect x="1216" y="258" width="144" height="44" rx="9" fill="#171717"/>
<text x="1288.0" y="286.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">查询</text>
<rect x="80" y="354" width="302" height="200" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="102" y="395" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">原售卖成交</text>
<text x="102" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="start">3 件</text>
<text x="102" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#737373" text-anchor="start">¥30.00</text>
<rect x="406" y="354" width="302" height="200" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="428" y="395" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">成功退货退款</text>
<text x="428" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="start">1 件</text>
<text x="428" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#737373" text-anchor="start">¥10.00</text>
<rect x="732" y="354" width="302" height="200" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="754" y="395" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">净成交</text>
<text x="754" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="start">2 件</text>
<text x="754" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#737373" text-anchor="start">¥20.00</text>
<rect x="1058" y="354" width="302" height="200" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="1080" y="395" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">免费赠送</text>
<text x="1080" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="start">0 件</text>
<text x="1080" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">不计入售卖金额</text>
<rect x="80" y="590" width="1280" height="332" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="634" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#171717" text-anchor="start">统计口径</text>
<text x="108" y="687" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">原成交：已完成售卖订单，按原订单数量和单价统计。</text>
<text x="108" y="730" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">成功退货退款：退款确认成功后计入；处理中或失败不扣减。</text>
<text x="108" y="773" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">净成交：原成交减去成功退货退款。赠送数量单列，金额不并入售卖。</text>
<text x="108" y="816" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">普通卖家复用本页，查询范围锁定本人，不能选择其他卖家。</text>
<text x="1084" y="1008" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#171717" text-anchor="start">查看操作日志 →</text>
<line x1="80" y1="1058" x2="1360" y2="1058" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1082" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
</svg>
