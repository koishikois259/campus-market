<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160">
<title>代交授权与订单任务分配</title>
<desc>校园二手交易系统补充模块初稿，白底黑字和彩色商品图。待审查，非真实业务。</desc>
<rect x="0" y="0" width="1440" height="1160" rx="0" fill="#FFFFFF"/>
<line x1="80" y1="79" x2="1360" y2="79" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#171717" text-anchor="start">校园集市</text>
<text x="310" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">商品审核</text>
<text x="456" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">举报与异常</text>
<text x="634" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">权限与分配</text>
<line x1="634" y1="78" x2="714" y2="78" stroke="#171717" stroke-width="2"/>
<text x="812" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">统计与日志</text>
<text x="1220" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="end">管理员</text>
<text x="1360" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="end">许老师</text>
<text x="80" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">权限与代交分配</text>
<text x="80" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">普通账号不能自行获得代交或管理权限。</text>
<rect x="80" y="230" width="620" height="774" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="274" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">人员授权</text>
<text x="108" y="324" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">账号</text>
<rect x="108" y="340" width="564" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="122" y="368" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">赵同学</text>
<text x="108" y="430" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">基础身份：买方／卖方</text>
<rect x="112" y="476" width="16" height="16" rx="4" fill="#171717" stroke="#E7E7E7"/>
<path d="M116 484 l3 3 l5 -6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="490" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#303030" text-anchor="start">官方代交权限</text>
<text x="108" y="546" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">当前已授权，可处理分配给本人的任务。</text>
<text x="108" y="609" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">变更原因 *</text>
<rect x="108" y="627" width="564" height="96" rx="7" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="122" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">按平台安排授权官方代交任务处理</text>
<rect x="108" y="771" width="564" height="48" rx="9" fill="#171717"/>
<text x="390.0" y="801.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">保存授权变更</text>
<text x="108" y="900" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">管理员账号通过授权方式配置，</text>
<text x="108" y="928" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">不在普通注册中自选。</text>
<rect x="740" y="230" width="620" height="774" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="768" y="274" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">分配代交任务</text>
<text x="768" y="335" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">O20261104001</text>
<text x="768" y="382" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">高等数学教材（上册） · 3件</text>
<text x="768" y="422" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">线上售卖已付款 · 平台代交</text>
<text x="768" y="462" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">当前尚未分配代交人</text>
<text x="768" y="547" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">代交人</text>
<rect x="768" y="563" width="564" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="782" y="591" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">赵同学（已授权，可分配）                ▾</text>
<rect x="768" y="672" width="564" height="78" rx="7" fill="#F5F5F5"/>
<text x="784" y="702" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">仅向已付款售卖或赠送订单分配。</text>
<text x="784" y="729" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">无可用代交人时，不能强行创建取件任务。</text>
<rect x="768" y="816" width="564" height="48" rx="9" fill="#171717"/>
<text x="1050.0" y="846.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">确认分配任务</text>
<text x="768" y="943" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#171717" text-anchor="start">查看无人代交与共同改约 →</text>
<text x="80" y="1080" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#171717" text-anchor="start">账号限制、解除及学校邮箱设置 →</text>
<line x1="80" y1="1118" x2="1360" y2="1118" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1142" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
</svg>
