<circle cx="360" cy="897" r="8" fill="#D3D3D3"/>
<circle cx="360" cy="897" r="6" fill="#FFFFFF"/>
<text x="379" y="903" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">不支持售后退款</text>
<text x="108" y="937" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">售卖须明确选择；声明随订单保留。</text>
<text x="108" y="983" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">商品描述与磨损情况 *</text>
<rect x="108" y="1000" width="824" height="118" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="122" y="1030" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">二手，使用一学期。封面右下角轻微磨损（见细节图）。</text>
<text x="122" y="1061" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">内页有少量铅笔笔记，无缺页，装订完好。</text>
<text x="108" y="1144" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="start">说明使用情况、磨损位置和已知问题；全新闲置可说明未使用情况。</text>
<rect x="992" y="208" width="368" height="266" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="1020" y="247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">发布前请检查</text>
<circle cx="1026" cy="286" r="5" fill="#171717"/>
<text x="1044" y="291" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">新旧情况明确</text>
<text x="1044" y="316" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">选择全新闲置或二手。</text>
<circle cx="1026" cy="354" r="5" fill="#171717"/>
<text x="1044" y="359" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">图片与文字一致</text>
<text x="1044" y="384" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">说明使用情况与磨损位置。</text>
<circle cx="1026" cy="422" r="5" fill="#171717"/>
<text x="1044" y="427" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">审核通过后公开</text>
<text x="1044" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">驳回后可修改并重新提交。</text>
<rect x="992" y="504" width="368" height="50" rx="9" fill="#171717"/>
<text x="1176.0" y="535.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">提交审核</text>
<rect x="992" y="568" width="368" height="48" rx="9" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="1176.0" y="598.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#303030" text-anchor="middle">保存草稿</text>
<text x="992" y="650" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">* 为必填项</text>
<text x="992" y="680" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">免费赠送时金额为 0，</text>
