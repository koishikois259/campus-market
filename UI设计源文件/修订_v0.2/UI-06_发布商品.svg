<text x="538" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">数量 *</text>
<rect x="538" y="781" width="394" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="552" y="809" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">6</text>
<text x="108" y="865" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">售后声明 *</text>
<circle cx="120" cy="897" r="8" fill="#171717"/>
<circle cx="120" cy="897" r="6" fill="#FFFFFF"/>
<circle cx="120" cy="897" r="4" fill="#171717"/>
