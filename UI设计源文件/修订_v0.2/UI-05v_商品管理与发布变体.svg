<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070">
<title>商品管理与表单的局部变体</title>
<desc>校园二手交易系统 UI v0.2 修订稿，白底黑字。可导入的矢量素材，样例数据均为虚构。</desc>
<rect x="0" y="0" width="1440" height="1070" rx="0" fill="#FFFFFF"/>
<text x="80" y="78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">商品管理与发布反馈</text>
<text x="80" y="111" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">草稿、驳回、受限操作与重新审核</text>
<rect x="80" y="144" width="1280" height="238" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<rect x="108" y="167" width="164" height="28" rx="7" fill="#F6F6F6"/>
<text x="190.0" y="186" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">草稿 · 审核驳回</text>
<text x="108" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#171717" text-anchor="start">高等数学教材（上册）</text>
<text x="108" y="262" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">驳回原因：请补充封面清晰图片，并说明内页笔记情况。</text>
<text x="108" y="290" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">修改后可重新提交审核，审核通过前不会公开展示。</text>
<rect x="108" y="315" width="170" height="42" rx="9" fill="#171717"/>
<text x="193.0" y="342.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">修改并重新提交</text>
<rect x="80" y="406" width="1280" height="238" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<rect x="108" y="429" width="66" height="28" rx="7" fill="#F5F5F5"/>
<text x="141.0" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">已发布</text>
<text x="108" y="488" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#171717" text-anchor="start">高等数学教材（上册）</text>
<text x="108" y="527" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#515151" text-anchor="start">存在 1 笔有效预约，占用 3 件；暂不能修改或直接下架。</text>
<text x="108" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">可用数量 3 件；预约占用 3 件。</text>
<rect x="108" y="586" width="110" height="40" rx="9" fill="#F3F3F3"/>
<text x="163.0" y="612.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#A3A3A3" text-anchor="middle">编辑</text>
<rect x="234" y="586" width="110" height="40" rx="9" fill="#F3F3F3"/>
<text x="289.0" y="612.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#A3A3A3" text-anchor="middle">下架</text>
<rect x="1132" y="586" width="200" height="40" rx="9" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="1232.0" y="612.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#303030" text-anchor="middle">查看关联订单</text>
<rect x="80" y="668" width="620" height="270" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="711" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#171717" text-anchor="start">提交前请完善售后声明</text>
<circle cx="120" cy="749" r="8" fill="#D3D3D3"/>
<circle cx="120" cy="749" r="6" fill="#FFFFFF"/>
<text x="139" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">支持售后退款</text>
<circle cx="370" cy="749" r="8" fill="#D3D3D3"/>
<circle cx="370" cy="749" r="6" fill="#FFFFFF"/>
<text x="389" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">不支持售后退款</text>
<text x="108" y="797" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">售卖商品必须明确选择，当前不能提交审核。</text>
<rect x="108" y="841" width="564" height="46" rx="9" fill="#F3F3F3"/>
<text x="390.0" y="870.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#A3A3A3" text-anchor="middle">提交审核</text>
<rect x="740" y="668" width="620" height="270" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="768" y="711" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#171717" text-anchor="start">免费赠送</text>
<text x="768" y="754" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">商品金额</text>
<text x="1332" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#171717" text-anchor="end">¥ 0.00</text>
<text x="768" y="796" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">无需付款，无退款流程。</text>
<text x="768" y="824" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">数量与审核规则保持一致。</text>
<rect x="768" y="866" width="564" height="46" rx="9" fill="#171717"/>
<text x="1050.0" y="895.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">提交审核</text>
<line x1="80" y1="1028" x2="1360" y2="1028" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1052" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
</svg>
