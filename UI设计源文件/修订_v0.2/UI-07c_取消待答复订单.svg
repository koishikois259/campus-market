<text x="108" y="700" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">买家 周同学申请取消</text>
<text x="108" y="734" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">原因：学习计划调整，希望协商取消。</text>
