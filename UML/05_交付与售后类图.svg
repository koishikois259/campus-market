<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1720px;height:987px;background:#FFFFFF;" width="1720px" height="987px" viewBox="0 0 1720 987" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="749.33" y="24.813" fill="#000" font-size="14" textLength="214.84" font-weight="700" font-family="Microsoft YaHei">05 交付与售后类图 · AI 初稿 v0.1</text></g><!--cluster 交付与售后 fulfillment--><g class="cluster" data-qualified-name="..... fulfillment" id="ent0001" data-source-line="0"><rect x="59" y="51.478" width="810" height="814" fill="#ECFEFF" style="stroke:#94A3B8;stroke-width:1.5;" rx="4" ry="4"/><text x="395.322" y="67.233" fill="#000" font-size="13" textLength="137.357" font-weight="700" font-family="Microsoft YaHei">交付与售后 fulfillment</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="5"><path d="M1293.5,687.478 L1293.5,740.951 A4,4 0 0 0 1297.5,744.951 L1700.5,744.951 A4,4 0 0 0 1704.5,740.951 L1704.5,693.478 L1694.5,683.478 L1458.432,683.478 L852.594,357.675 L1450.432,683.478 L1297.5,683.478 A4,4 0 0 0 1293.5,687.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1694.5,683.478 L1694.5,691.478 A2,2 0 0 0 1696.5,693.478 L1704.5,693.478 L1694.5,683.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="1299.5" y="702.233" fill="#000" font-size="13" textLength="390" font-family="Microsoft YaHei">仅被分配且有权限的代交人操作；同一订单最多一条有效代交路径。</text><text x="1299.5" y="719.391" fill="#000" font-size="13" textLength="299" font-family="Microsoft YaHei">线上售卖已付款或赠送才可取件；未取件不能交件。</text><text x="1299.5" y="736.548" fill="#000" font-size="13" textLength="312" font-family="Microsoft YaHei">交件不是买家确认收货；改约后旧任务不可继续交付。</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="10"><path d="M885,678.478 L885,749.108 A4,4 0 0 0 889,753.108 L1270.564,753.108 A4,4 0 0 0 1274.564,749.108 L1274.564,684.478 L1264.564,674.478 L1034.244,674.478 L617.136,505.948 L1026.244,674.478 L889,674.478 A4,4 0 0 0 885,678.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1264.564,674.478 L1264.564,682.478 A2,2 0 0 0 1266.564,684.478 L1274.564,684.478 L1264.564,674.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="891" y="693.233" fill="#000" font-size="13" textLength="368.564" font-family="Microsoft YaHei">仅原声明支持售后的付费订单，收货后连续 168 小时内可申请。</text><text x="891" y="710.391" fill="#000" font-size="13" textLength="365.612" font-family="Microsoft YaHei">原数量 - 成功退货数量 - 其他有效申请占用 >= 本次申请数量。</text><text x="891" y="727.548" fill="#000" font-size="13" textLength="360.94" font-family="Microsoft YaHei">卖家 48 小时内答复；拒绝或超时后，由买家申请管理员介入。</text><text x="891" y="744.706" fill="#000" font-size="13" textLength="260" font-family="Microsoft YaHei">超时提醒或管理员批准都不能替代退货验收。</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="16"><path d="M6,896.478 L6,967.108 A4,4 0 0 0 10,971.108 L400,971.108 A4,4 0 0 0 404,967.108 L404,902.478 L394,892.478 L209,892.478 L205,849.625 L201,892.478 L10,892.478 A4,4 0 0 0 6,896.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M394,892.478 L394,900.478 A2,2 0 0 0 396,902.478 L404,902.478 L394,892.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="12" y="911.233" fill="#000" font-size="13" textLength="377" font-family="Microsoft YaHei">通过验收的数量作为本次退款依据，不能重复验收形成多次退款。</text><text x="12" y="928.391" fill="#000" font-size="13" textLength="351" font-family="Microsoft YaHei">初稿采用一次申请一次最终验收；只接受整笔申请数量通过，</text><text x="12" y="945.548" fill="#000" font-size="13" textLength="351" font-family="Microsoft YaHei">不符合时转管理员核查，不自行缩减原申请数量或自动赔偿。</text><text x="12" y="962.706" fill="#000" font-size="13" textLength="328.009" font-family="Microsoft YaHei">完好退回另建 ReturnedLot，待重新审核才能计入可售。</text></g><!--class DeliveryTask--><g class="entity" data-qualified-name="..... fulfillment.DeliveryTask" id="ent0002" data-source-line="1"><rect x="647.5" y="129.978" width="205.375" height="357.276" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="725.257" y="148.733" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="705.188" y="168.007" fill="#000" font-size="15" textLength="90" font-family="Microsoft YaHei">平台代交任务</text><text x="705.202" y="187.804" fill="#000" font-size="15" textLength="89.971" font-family="Microsoft YaHei">DeliveryTask</text><line x1="648.5" y1="196.73" x2="851.875" y2="196.73" style="stroke:#64748B;stroke-width:0.5;"/><text x="653.5" y="214.485" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-任务编号: UUID</text><text x="653.5" y="231.643" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-订单编号: UUID</text><text x="653.5" y="248.801" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-方案编号: UUID</text><text x="653.5" y="265.958" fill="#000" font-size="13" textLength="110.735" font-family="Microsoft YaHei">-代交人编号: UUID</text><text x="653.5" y="283.116" fill="#000" font-size="13" textLength="136.735" font-family="Microsoft YaHei">-分配管理员编号: UUID</text><text x="653.5" y="300.274" fill="#000" font-size="13" textLength="153.245" font-family="Microsoft YaHei">-任务状态: DeliveryStatus</text><text x="653.5" y="317.432" fill="#000" font-size="13" textLength="107.333" font-family="Microsoft YaHei">-分配时间: Instant</text><text x="653.5" y="334.589" fill="#000" font-size="13" textLength="141.369" font-family="Microsoft YaHei">-取件时间: Instant [0..1]</text><text x="653.5" y="351.747" fill="#000" font-size="13" textLength="141.369" font-family="Microsoft YaHei">-交件时间: Instant [0..1]</text><text x="653.5" y="368.905" fill="#000" font-size="13" textLength="135.732" font-fam