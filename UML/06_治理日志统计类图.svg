xt><line x1="126" y1="791.23" x2="365.963" y2="791.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="131" y="808.985" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-用户编号: UUID</text><text x="131" y="826.143" fill="#000" font-size="13" textLength="229.963" font-family="Microsoft YaHei">-受限权限集合: Set&lt;PermissionCode></text><line x1="126" y1="833.545" x2="365.963" y2="833.545" style="stroke:#64748B;stroke-width:0.5;"/></g><!--class ProductRestriction--><g class="entity" data-qualified-name="........ governance.ProductRestriction" id="ent0005" data-source-line="31"><rect x="385" y="724.478" width="231.959" height="117.068" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="476.049" y="743.233" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="470.979" y="762.507" fill="#000" font-size="15" textLength="60" font-family="Microsoft YaHei">商品限制</text><text x="434.567" y="782.304" fill="#000" font-size="15" textLength="132.825" font-family="Microsoft YaHei">ProductRestriction</text><line x1="386" y1="791.23" x2="615.959" y2="791.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="391" y="808.985" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-商品编号: UUID</text><text x="391" y="826.143" fill="#000" font-size="13" textLength="219.959" font-family="Microsoft YaHei">-处置方式: ProductRestrictionAction</text><line x1="386" y1="833.545" x2="615.959" y2="833.545" style="stroke:#64748B;stroke-width:0.5;"/></g><!--class AuditLog--><g class="entity" data-qualified-name="........ governance.AuditLog" id="ent0006" data-source-line="35"><rect x="316" y="96.478" width="177.794" height="271.487" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="358.696" y="115.233" fill="#000" font-size="13" textLength="92.403" font-style="italic" font-family="Microsoft YaHei">«append only»</text><text x="359.897" y="134