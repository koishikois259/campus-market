<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1959px;height:881px;background:#FFFFFF;" width="1959px" height="881px" viewBox="0 0 1959 881" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="847.83" y="24.813" fill="#000" font-size="14" textLength="256.84" font-weight="700" font-family="Microsoft YaHei">06 治理、日志与统计类图 · AI 初稿 v0.1</text></g><!--cluster 治理、日志与统计 governance--><g class="cluster" data-qualified-name="........ governance" id="ent0001" data-source-line="0"><rect x="14" y="43.478" width="714" height="814" fill="#FFF1F2" style="stroke:#94A3B8;stroke-width:1.5;" rx="4" ry="4"/><text x="278.864" y="59.233" fill="#000" font-size="13" textLength="184.272" font-weight="700" font-family="Microsoft YaHei">治理、日志与统计 governance</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="5"><path d="M744,756.478 L744,809.951 A4,4 0 0 0 748,813.951 L1164,813.951 A4,4 0 0 0 1168,809.951 L1168,762.478 L1158,752.478 L887.037,752.478 L555.619,619.989 L879.037,752.478 L748,752.478 A4,4 0 0 0 744,756.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1158,752.478 L1158,760.478 A2,2 0 0 0 1160,762.478 L1168,762.478 L1158,752.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="750" y="771.233" fill="#000" font-size="13" textLength="364" font-family="Microsoft YaHei">账号限制与商品限制继承共同的原因、期限、设置和解除记录。</text><text x="750" y="788.391" fill="#000" font-size="13" textLength="403" font-family="Microsoft YaHei">限制与解除均由管理员操作；到期进入待核查，不能由普通用户解除。</text><text x="750" y="805.548" fill="#000" font-size="13" textLength="325" font-family="Microsoft YaHei">限制商品阻止新预约，已有订单与付款历史保持可追溯。</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="10"><path d="M744.5,542.478 L744.5,578.793 A4,4 0 0 0 748.5,582.793 L1127.449,582.793 A4,4 0 0 0 1131.449,578.793 L1131.449,548.478 L1121.449,538.478 L915.867,538.478 L297.633,371.51 L907.867,538.478 L748.5,538.478 A4,4 0 0 0 744.5,542.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1121.449,538.478 L1121.449,546.478 A2,2 0 0 0 1123.449,548.478 L1131.449,548.478 L1121.449,538.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="750.5" y="557.233" fill="#000" font-size="13" textLength="365.949" font-family="Microsoft YaHei">目标为 PRODUCT 或 ORDER，目标编号只引用一个具体对象。</text><text x="750.5" y="574.391" fill="#000" font-size="13" textLength="247" font-family="Microsoft YaHei">受理时检查目标存在、处理人管理员权限。</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="14"><path d="M1150,533.978 L1150,587.451 A4,4 0 0 0 1154,591.451 L1517.689,591.451 A4,4 0 0 0 1521.689,587.451 L1521.689,539.978 L1511.689,529.978 L1305.749,529.978 L490.762,367.608 L1297.749,529.978 L1154,529.978 A4,4 0 0 0 1150,533.978" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1511.689,529.978 L1511.689,537.978 A2,2 0 0 0 1513.689,539.978 L1521.689,539.978 L1511.689,529.978" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="1156" y="548.733" fill="#000" font-size="13" textLength="350.689" font-family="Microsoft YaHei">USER 操作者有用户编号，SYSTEM 操作者有自动任务代码。</text><text x="1156" y="565.891" fill="#000" font-size="13" textLength="342.564" font-family="Microsoft YaHei">失败、拒绝、超时提醒等同样记录；日志至少保留 180 天。</text><text x="1156" y="583.048" fill="#000" font-size="13" textLength="312" font-family="Microsoft YaHei">日志仅追加，查询按权限过滤；本期不提供导出功能。</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="19"><path d="M1540.5,524.978 L1540.5,595.608 A4,4 0 0 0 1544.5,599.608 L1947.5,599.608 A4,4 0 0 0 1951.5,595.608 L1951.5,530.978 L1941.5,520.978 L1695.434,520.978 L711.549,244.254 L1687.434,520.978 L1544.5,520.978 A4,4 0 0 0 1540.5,524.978" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1941.5,520.978 L1941.5,528.978 A2,2 0 0 0 1943.5,530.978 L1951.5,530.978 L1941.5,520.978" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="1546.5" y="539.733" fill="#000" font-size="13" textLength="390" font-family="Microsoft YaHei">从已完成订单及成功售后退款聚合，避免重复维护另一份成交真相。</text><text x="1546.5" y="556.891" fill="#000" font-size="13" textLength="303.653" font-family="Microsoft YaHei">净售卖数量 = 原售卖成交数量 - 成功售后退货数量。</text><text x="1546.5" y="574.048" fill="#000" font-size="13" textLength="303.653" font-family="Microsoft YaHei">净售卖金额 = 原售卖成交金额 - 成功售后退款金额。</text><text x="1546.5" y="591.206" fill="#000" font-size="13" textLength="273" font-family="Microsoft YaHei">赠送单独统计；售后不改写原成交数量和金额。</text></g><!--class Report--><g class="entity" data-qualified-name="........ governance.Report" id="ent0002" data-source-line="1"><rect x="30.5" y="87.478" width="266.966" height="288.645" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="139.053" y="106.233" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="148.983" y="125.507" fill="#000" font-size="15" textLength="30" font-family="Microsoft YaHei">举报</text><text x="139.615" y="145.304" fill="#000" font-size="15" textLength="48.735" font-family="Microsoft YaHei">Report</text><line x1="31.5" y1="154.23" x2="296.466" y2="154.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="36.5" y="171.985" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-举报编号: UUID</text><text x="36.5" y="189.143" fill="#000" font-size="13" textLength="110.735" font-family="Microsoft YaHei">-举报人编号: UUID</text><text x="36.5" y="206.301" fill="#000" font-size="13" textLength="176.985" font-family="Microsoft YaHei">-目标类型: ReportTargetType</text><text x="36.5" y="223.458" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-目标编号: UUID</text><text x="36.5" y="240.616" fill="#000" font-size="13" textLength="101.696" font-family="Microsoft YaHei">-举报原因: String</text><text x="36.5" y="257.774" fill="#000" font-size="13" textLength="167.972" font-family="Microsoft YaHei">-证据地址集合: List&lt;String></text><text x="36.5" y="274.932" fill="#000" font-size="13" textLength="107.333" font-family="Microsoft YaHei">-提交时间: Instant</text><text x="36.5" y="292.089" fill="#000" font-size="13" textLength="170.771" font-family="Microsoft YaHei">-处理管理员编号: UUID [0..1]</text><text x="36.5" y="309.247" fill="#000" font-size="13" textLength="145.241" font-family="Microsoft YaHei">-处理状态: ReportStatus</text><text x="36.5" y="326.405" fill="#000" font-size="13" textLength="135.732" font-family="Microsoft YaHei">-处理结论: String [0..1]</text><text x="36.5" y="343.563" fill="#000" font-size="13" textLength="141.369" font-family="Microsoft YaHei">-处理时间: Instant [0..1]</text><line x1="31.5" y1="350.965" x2="296.466" y2="350.965" style="stroke:#64748B;stroke-width:0.5;"/><text x="36.5" y="368.72" fill="#000" font-size="13" textLength="254.966" font-family="Microsoft YaHei">+记录处理结论(adminId, conclusion): void</text></g><!--class Restriction--><g class="entity" data-qualified-name="........ governance.Restriction" id="ent0003" data-source-line="15"><rect x="266.5" y="433.478" width="288.764" height="254.33" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="385.952" y="452.233" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="380.882" y="471.507" fill="#000" font-size="15" textLength="60" font-style="italic" font-family="Microsoft YaHei">违规限制</text><text x="372.664" y="491.304" fill="#000" font-size="15" textLength="76.436" font-style="italic" font-family="Microsoft YaHei">Restriction</text><line x1="267.5" y1="500.23" x2="554.264" y2="500.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="272.5" y="517.985" fill="#000" font-size="13" textLength="97.735" font-