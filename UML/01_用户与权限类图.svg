<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1062px;height:764px;background:#FFFFFF;" width="1062px" height="764px" viewBox="0 0 1062 764" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="420.08" y="24.813" fill="#000" font-size="14" textLength="214.84" font-weight="700" font-family="Microsoft YaHei">01 用户与权限类图 · AI 初稿 v0.1</text></g><!--cluster 用户与权限 identity--><g class="cluster" data-qualified-name="..... identity" id="ent0001" data-source-line="0"><rect x="14" y="51.478" width="668" height="591" fill="#EFF6FF" style="stroke:#94A3B8;stroke-width:1.5;" rx="4" ry="4"/><text x="288.288" y="67.233" fill="#000" font-size="13" textLength="119.425" font-weight="700" font-family="Microsoft YaHei">用户与权限 identity</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="5"><path d="M257.5,673.478 L257.5,744.108 A4,4 0 0 0 261.5,748.108 L586.5,748.108 A4,4 0 0 0 590.5,744.108 L590.5,679.478 L580.5,669.478 L428,669.478 L424,626.75 L420,669.478 L261.5,669.478 A4,4 0 0 0 257.5,673.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M580.5,669.478 L580.5,677.478 A2,2 0 0 0 582.5,679.478 L590.5,679.478 L580.5,669.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="263.5" y="688.233" fill="#000" font-size="13" textLength="305.367" font-family="Microsoft YaHei">RoleCode = BUYER / SELLER / COURIER / ADMIN</text><text x="263.5" y="705.391" fill="#000" font-size="13" textLength="195" font-family="Microsoft YaHei">同一用户可有多个有效角色授权。</text><text x="263.5" y="722.548" fill="#000" font-size="13" textLength="312" font-family="Microsoft YaHei">普通注册只建立普通买卖权限；管理员不能自助注册。</text><text x="263.5" y="739.706" fill="#000" font-size="13" textLength="312" font-family="Microsoft YaHei">代交授权、管理员配置须由授权入口执行并记录日志。</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="11"><path d="M698,481.478 L698,534.951 A4,4 0 0 0 702,538.951 L1049.94,538.951 A4,4 0 0 0 1053.94,534.951 L1053.94,487.478 L1043.94,477.478 L840.045,477.478 L208.27,327.617 L832.045,477.478 L702,477.478 A4,4 0 0 0 698,481.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1043.94,477.478 L1043.94,485.478 A2,2 0 0 0 1045.94,487.478 L1053.94,487.478 L1043.94,477.478" style="stroke:#D6B66A;stroke-width:0.5;" fill="#FFFBEB"/><text x="704" y="496.233" fill="#000" font-size="13" textLength="273.787" font-family="Microsoft YaHei">验证码保存摘要，5 分钟有效，错误 5 次失效。</text><text x="704" y="513.391" fill="#000" font-size="13" textLength="334.94" font-family="Microsoft YaHei">同一邮箱发送间隔至少 60 秒，发送与核验均需并发控制。</text><text x="704" y="530.548" fill="#000" font-size="13" textLength="286" font-family="Microsoft YaHei">本期采用邮箱验证码登录，不额外假定密码登录。</text></g><!--class User--><g class="entity" data-qualified-name="..... identity.User" id="ent0002" data-source-line="1"><rect x="486.5" y="120.978" width="179.369" height="185.699" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="551.254" y="139.733" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="561.184" y="159.007" fill="#000" font-size="15" textLength="30" font-family="Microsoft YaHei">用户</text><text x="559.994" y="178.804" fill="#000" font-size="15" textLength="32.38" font-family="Microsoft YaHei">User</text><line x1="487.5" y1="187.73" x2="664.869" y2="187.73" style="stroke:#64748B;stroke-width:0.5;"/><text x="492.5" y="205.485" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-用户编号: UUID</text><text x="492.5" y="222.643" fill="#000" font-size="13" textLength="157.409" font-family="Microsoft YaHei">-学校邮箱: String {unique}</text><text x="492.5" y="239.801" fill="#000" font-size="13" textLength="167.369" font-family="Microsoft YaHei">-邮箱验证时间: Instant [0..1]</text><text x="492.5" y="256.958" fill="#000" font-size="13" textLength="107.333" font-family="Microsoft YaHei">-注册时间: Instant</text><text x="492.5" y="274.116" fill="#000" font-size="13" textLength="79.65" font-family="Microsoft YaHei">-版本号: long</text><line x1="487.5" y1="281.519" x2="664.869" y2="281.519" style="stroke:#64748B;stroke-width:0.5;"/><text x="492.5" y="299.274" fill="#000" font-size="13" textLength="115.166" font-family="Microsoft YaHei">+已验证(): boolean</text></g><!--class Role--><g class="entity" data-qualified-name="..... identity.Role" id="ent0003" data-source-line="9"><rect x="226" y="138.478" width="241.963" height="151.383" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="322.051" y="157.233" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="331.981" y="176.507" fill="#000" font-size="15" textLength="30" font-family="Microsoft YaHei">角色</text><text x="331.066" y="196.304" fill="#000" font-size="15" textLength="31.831" font-family="Microsoft YaHei">Role</text><line x1="227" y1="205.23" x2="466.963" y2="205.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="232" y="222.985" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-角色编号: UUID</text><text x="232" y="240.143" fill="#000" font-size="13" textLength="180.553" font-family="Microsoft YaHei">-角色代码: RoleCode {unique}</text><text x="232" y="257.301" fill="#000" font-size="13" textLength="229.963" font-family="Microsoft YaHei">-权限代码集合: Set&lt;PermissionCode></text><line x1="227" y1="264.703" x2="466.963" y2="264.703" style="stroke:#64748B;stroke-width:0.5;"/><text x="232" y="282.458" fill="#000" font-size="13" textLength="158.641" font-family="Microsoft YaHei">+包含权限(code): boolean</text></g><!--class RoleGrant--><g class="entity" data-qualified-name="..... identity.RoleGrant" id="ent0004" data-source-line="15"><rect x="332.5" y="389.478" width="182.771" height="237.172" fill="#FFF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="398.955" y="408.233" fill="#000" font-size="13" textLength="49.861" font-style="italic" font-family="Microsoft YaHei">«entity»</text><text x="393.885" y="427.507" fill="#000" font-size="15" textLength="60" font-family="Microsoft YaHei">角色授权</text><text x="387.968" y="447.304" fill="#000" font-size="15" textLength="71.836" font-family="Microsoft YaHei">RoleGrant</text><line x1="333.5" y1="456.23" x2="514.271" y2="456.23" style="stroke:#64748B;stroke-width:0.5;"/><text x="338.5" y="473.985" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-授权编号: UUID</text><text x="338.5" y="491.143" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-用户编号: UUID</text><text x="338.5" y="508.301" fill="#000" font-size="13" textLength="97.735" font-family="Microsoft YaHei">-角色编号: UUID</text><text x="338.5" y="525.458" fill="#000" font-size="13" textLength="141.908" font-family="Microsoft YaHei">-授权来源: GrantSource</text><text x="338.5" y="542.616" fill="#000" font-size="13" textLength="170.771" font-family="Microsoft YaHei">-授权管理员编号: UUID [0..1]</text><text x="338.5" y="559.774" fill="#000" font-size="13" textLength="107.333" font-family="Microsoft YaHei">-授权时间: Instant</text><text x="338.5" y="576.932" fill="#000" font-size="13" textLength="141.369" font-family="Microsoft YaHei">-撤销时间: Instant [0..1]</text><line x1="333.5" y1="584.334" x2="514.271" y2="584.334" style="stroke:#64748B;stroke-width:0.5;"/><text x="338.5" y="602.089" fill="#000" font-size="13" textLength="128.166" font-family="Microsoft YaHei">+当前有效(): boolean</text><text x="338.5" y="619.247" fill="#000" font-size="13" textLength="104.705" font-family="Microsoft YaHei">+撤销(now): void</text></g><!--class EmailChallenge--><g class="entity" data-qualified-name="..... identity.EmailChallenge" id="ent0005" data-source-line="26"><rect x="30" y="95.478" wid