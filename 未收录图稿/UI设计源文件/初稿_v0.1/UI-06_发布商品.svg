<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
<title>发布与编辑商品</title>
<desc>校园二手交易系统 UI 初稿，可导入 Pixso 的矢量画板。样例数据均为虚构。</desc>
<rect x="0" y="0" width="1440" height="1120" rx="0" fill="#F5F7F4"/>
<rect x="0" y="0" width="1440" height="80" rx="0" fill="#FFFFFF"/>
<line x1="0" y1="79" x2="1440" y2="79" stroke="#E1E8E1" stroke-width="1"/>
<rect x="72" y="22" width="36" height="36" rx="11" fill="#187559"/>
<path d="M82 46 C80 30 98 29 99 30 C100 44 92 50 82 46 Z" fill="#CFE6CD"/>
<path d="M83 48 L95 35" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="49" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#18372D" text-anchor="start">校园集市</text>
<text x="324" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#67766C" text-anchor="start">商品广场</text>
<text x="454" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#187559" text-anchor="start">发布商品</text>
