<text x="454" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">交易方案</text>
<line x1="454" y1="78" x2="518" y2="78" stroke="#171717" stroke-width="2"/>
<text x="584" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">付款与交付</text>
<text x="754" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">售后服务</text>
<text x="1220" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="end">邮箱已验证</text>
<text x="1360" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="end">周同学</text>
<text x="80" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">修改交易方案</text>
<text x="80" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">高等数学教材（上册） · O20261104001 · 售卖 ¥30.00</text>
<rect x="80" y="228" width="780" height="566" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">当前新方案</text>
<text x="108" y="331" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">付款方式</text>
<circle cx="120" cy="372" r="8" fill="#171717"/>
<circle cx="120" cy="372" r="6" fill="#FFFFFF"/>
<circle cx="120" cy="372" r="4" fill="#171717"/>
<text x="140" y="378" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">线上付款</text>
<circle cx="362" cy="372" r="8" fill="#D3D3D3"/>
<circle cx="362" cy="372" r="6" fill="#FFFFFF"/>
<text x="382" y="378" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">线下付款</text>
<text x="108" y="451" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">交付方式</text>
<circle cx="120" cy="492" r="8" fill="#D3D3D3"/>
<circle cx="120" cy="492" r="6" fill="#FFFFFF"/>
<text x="140" y="498" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">见面交付</text>
<circle cx="362" cy="492" r="8" fill="#171717"/>
<circle cx="362" cy="492" r="6" fill="#FFFFFF"/>
<circle cx="362" cy="492" r="4" fill="#171717"/>
<text x="382" y="498" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">平台代交</text>
<text x="108" y="570" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">交付说明</text>
<rect x="108" y="586" width="724" height="44" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="122" y="614" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">图书馆东门取件，教学楼南门交件</text>
<rect x="108" y="703" width="724" height="48" rx="9" fill="#171717"/>
<text x="470.0" y="733.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">保存新方案</text>
<rect x="892" y="228" width="468" height="566" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="920" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">变更确认</text>
<text x="920" y="330" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">原方案：线上付款、见面交付</text>
<text x="920" y="372" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#303030" text-anchor="start">新方案：线上付款、平台代交</text>
<rect x="920" y="442" width="412" height="78" rx="7" fill="#F5F5F5"/>
<text x="936" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">保存后，双方原确认均失效。</text>
<text x="936" y="499" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">须重新确认同一方案才能继续。</text>
<text x="920" y="598" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">售卖／赠送来自原订单，</text>
<text x="920" y="626" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">此处不能重新选择。</text>
<rect x="80" y="822" width="620" height="176" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="864" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">线下售卖</text>
<text x="108" y="905" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">仅可见面交付；平台代交不可选。</text>
<text x="108" y="933" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">双方确认后进入待交付，由卖方确认实际收款。</text>
<rect x="732" y="822" width="628" height="176" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="760" y="864" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">免费赠送</text>
<text x="760" y="905" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">无需付款，仅选择见面交付或平台代交。</text>
<text x="760" y="933" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">双方确认后进入待交付，不进入待付款。</text>
<line x1="80" y1="1058" x2="1360" y2="1058" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1082" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
