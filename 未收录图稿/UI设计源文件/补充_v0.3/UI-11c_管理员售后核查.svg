<text x="954" y="585" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">填写证据核查结果和处理原因</text>
<rect x="940" y="735" width="392" height="105" rx="7" fill="#F5F5F5"/>
<text x="956" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">同意后进入待退货。</text>
<text x="956" y="792" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">仍须退回并验收通过才处理退款。</text>
<text x="956" y="819" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">驳回保留原因，不改变原订单。</text>
<rect x="940" y="907" width="392" height="48" rx="9" fill="#171717"/>
<text x="1136.0" y="937.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">保存核查结论并通知双方</text>
<text x="80" y="1148" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#171717" text-anchor="start">查看售后其他分支 →</text>
<line x1="80" y1="1178" x2="1360" y2="1178" stroke="#E7E7E7" stroke-width="1"/>
