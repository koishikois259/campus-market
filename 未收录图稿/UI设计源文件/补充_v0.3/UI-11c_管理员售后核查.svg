<text x="108" y="527" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">买方证据</text>
<text x="108" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">内页存在破损，申请退回其中1件。</text>
<rect x="108" y="592" width="132" height="100" rx="12" fill="#E7EEE3"/>
<g transform="translate(119.45454545454545 601.0909090909091) scale(0.45454545454545453)">
