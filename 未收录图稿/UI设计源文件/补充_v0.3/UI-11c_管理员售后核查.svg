<rect x="80" y="230" width="800" height="840" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">申请与原订单</text>
<text x="108" y="327" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">高等数学教材（上册） · O20261104001</text>
<text x="108" y="373" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">买方周同学／卖方林同学 · 原声明支持售后</text>
<text x="108" y="409" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">原订单3件，共¥30.00 · 本次申请退1件、退款¥10.00</text>
<text x="108" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">原收货11月4日16:00 · 申请11月5日09:00，在168小时内</text>
