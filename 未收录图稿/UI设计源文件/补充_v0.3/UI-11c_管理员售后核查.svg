<text x="70" y="90" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#DFE9DC" text-anchor="start">上册</text>
<path d="M68 135 Q90 101 110 125 T169 111" fill="none" stroke="#D7E7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="69" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#D7E7CC" text-anchor="start">MATHEMATICS</text>
</g>
<g transform="translate(119.45454545454545 601.0909090909091) scale(0.45454545454545453)">
<path d="M177 145 l10 4 M176 151 l9 3 M180 157 l6 2" fill="none" stroke="#E2D6B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="181" cy="152" r="20" fill="none" stroke="#A76825" stroke-width="2"/>
</g>
<text x="264" y="629" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">问题图片 · 买方于11月5日09:00提交</text>
<text x="108" y="750" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">卖方答复与证据</text>
<text x="108" y="792" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">11月5日10:00拒绝：认为属于正常使用痕迹。</text>
<text x="108" y="824" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">附商品原描述和发布时细节图，待核对破损情况。</text>
<line x1="108" y1="879" x2="852" y2="879" stroke="#E7E7E7" stroke-width="1"/>
<text x="108" y="928" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">买方11月5日10:30申请介入：不同意拒绝结论，补充问题说明。</text>
<text x="108" y="962" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">核查数量、原声明、双方材料与沟通记录，保留处理依据。</text>
<rect x="912" y="230" width="448" height="840" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="940" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">处理结论</text>
<text x="940" y="332" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">当前为卖方拒绝后的介入分支。</text>
<circle cx="952" cy="395" r="8" fill="#171717"/>
<circle cx="952" cy="395" r="6" fill="#FFFFFF"/>
<circle cx="952" cy="395" r="4" fill="#171717"/>
