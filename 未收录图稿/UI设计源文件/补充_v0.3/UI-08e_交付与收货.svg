<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<title>交付进度与买方收货</title>
<desc>校园二手交易系统补充模块初稿，白底黑字和彩色商品图。待审查，非真实业务。</desc>
<rect x="0" y="0" width="1440" height="1100" rx="0" fill="#FFFFFF"/>
<line x1="80" y1="79" x2="1360" y2="79" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#171717" text-anchor="start">校园集市</text>
<text x="324" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">我的商品</text>
<text x="454" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">交易方案</text>
<text x="584" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">付款与交付</text>
<line x1="584" y1="78" x2="664" y2="78" stroke="#171717" stroke-width="2"/>
<text x="754" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">售后服务</text>
<text x="1220" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="end">邮箱已验证</text>
<text x="1360" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="end">周同学</text>
<text x="80" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#171717" text-anchor="start">订单交付中</text>
<text x="80" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">O20261104001 · ¥30.00 · 买家周同学／卖家林同学</text>
<rect x="80" y="228" width="800" height="594" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="108" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#171717" text-anchor="start">交付进度</text>
<text x="108" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">付款</text>
<text x="108" y="371" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#171717" text-anchor="start">已付款</text>
<text x="352" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">代交</text>
<text x="352" y="371" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#171717" text-anchor="start">已交件</text>
<text x="596" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">买方收货</text>
<text x="596" y="371" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#171717" text-anchor="start">待确认</text>
<line x1="108" y1="405" x2="852" y2="405" stroke="#E7E7E7" stroke-width="1"/>
<text x="108" y="451" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">14:35</text>
<text x="184" y="451" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">线上付款成功，货款待结算</text>
<text x="108" y="505" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">15:00</text>
<text x="184" y="505" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">赵同学记录取件，订单进入交付中</text>
<text x="108" y="559" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">15:40</text>
<text x="184" y="559" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">代交已交件，等待买方确认收到</text>
<rect x="108" y="648" width="126" height="112" rx="12" fill="#E7EEE3"/>
<g transform="translate(117.0 663.5) scale(0.45)">
<rect x="54" y="19" width="147" height="160" rx="9" fill="#CCD9C8"/>
<rect x="42" y="7" width="147" height="160" rx="9" fill="#527B60"/>
<rect x="42" y="7" width="12" height="160" rx="5" fill="#3D604A"/>
<rect x="65" y="32" width="100" height="3" rx="1" fill="#BCD0BB"/>
<text x="69" y="65" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">高等数学</text>
<text x="70" y="90" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#DFE9DC" text-anchor="start">上册</text>
<path d="M68 135 Q90 101 110 125 T169 111" fill="none" stroke="#D7E7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="69" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#D7E7CC" text-anchor="start">MATHEMATICS</text>
</g>
<text x="260" y="687" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">高等数学教材（上册）</text>
<text x="260" y="728" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start">二手 · ¥10.00 × 3 件</text>
<rect x="912" y="228" width="448" height="594" rx="8" fill="#FFFFFF" stroke="#E7E7E7"/>
<text x="940" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#171717" text-anchor="start">确认收货</text>
<text x="940" y="324" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">请核对已实际收到的商品与数量。</text>
<text x="940" y="358" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">代交人交件不能代替你的确认。</text>
<rect x="940" y="435" width="392" height="78" rx="7" fill="#F5F5F5"/>
<text x="956" y="465" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">确认收到3件后，订单完成，</text>
<text x="956" y="492" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">随后执行线上货款结算。</text>
<rect x="940" y="562" width="392" height="50" rx="9" fill="#171717"/>
<text x="1136.0" y="593.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">确认收到 3 件</text>
<text x="940" y="659" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#737373" text-anchor="start">当前货款：待买方收货后结算</text>
<text x="940" y="707" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">收货后按订单原声明申请售后。</text>
<rect x="80" y="866" width="340" height="44" rx="9" fill="#F3F3F3"/>
<text x="250.0" y="894.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#A3A3A3" text-anchor="middle">收货完成后可申请售后</text>
<line x1="80" y1="1058" x2="1360" y2="1058" stroke="#E7E7E7" stroke-width="1"/>
<text x="80" y="1082" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="start">校园集市</text>
</svg>
