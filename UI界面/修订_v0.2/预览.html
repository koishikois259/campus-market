<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园二手交易系统 · UI 修订稿预览</title>
<style>
  :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #171717; background: #F6F6F6; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, select { font: inherit; }
  button, select, a { -webkit-tap-highlight-color: transparent; }
  button, select { border: 1px solid #E4E4E4; border-radius: 7px; color: #303030; background: white; padding: 8px 12px; cursor: pointer; }
  button:hover, a:hover { color: #171717; }
  button:disabled { cursor: default; opacity: .4; }
  :focus-visible { outline: 3px solid #777777; outline-offset: 2px; }
  header { height: 68px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #E7E7E7; background: white; }
  h1 { font-size: 18px; margin: 0; }
  .badge { font-size: 12px; color: #171717; background: #F1F1F1; padding: 5px 9px; border-radius: 6px; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 246px minmax(0,1fr); height: calc(100dvh - 68px); }
  aside { background: white; padding: 20px 12px; overflow: auto; border-right: 1px solid #E7E7E7; }
  .nav-caption { color: #737373; font-size: 12px; padding: 0 12px; margin: 0 0 12px; }
  #pages { display: grid; gap: 6px; }
  .page { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border-color: transparent; padding: 12px; line-height: 1.6; }
  .page .num { font-size: 12px; color: #737373; font-variant-numeric: tabular-nums; }
  .page.active { color: #171717; background: #F1F1F1; font-weight: 600; }
  aside p:last-child { font-size: 12px; color: #737373; padding: 18px 12px; line-height: 1.9; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px; background: #FAFAFA; border-bottom: 1px solid #E7E7E7; }
  #count { min-width: 54px; text-align: center; color: #666666; font-size: 13px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .toolbar a { text-decoration: none; color: #171717; font-size: 13px; padding: 8px; }
  .info { padding: 14px 24px; background: #FAFAFA; border-bottom: 1px solid #E7E7E7; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  #note { font-size: 13px; color: #666666; line-height: 1.8; margin: 0; }
  #viewport { flex: 1; min-height: 0; overflow: auto; padding: 24px; }
  #artboard { display: block; max-width: none; margin: 0 auto; border: 1px solid #E7E7E7; box-shadow: 0 6px 24px #17171710; background: white; }
  #error { display: none; background: white; padding: 24px; line-height: 1.8; border-radius: 8px; color: #333333; }
  #mobile-pages { display: none; max-width: 220px; }
  footer { padding: 9px 20px; font-size: 12px; line-height: 1.7; color: #666666; background: #FAFAFA; border-top: 1px solid #E7E7E7; }
  @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } aside { display: none; } #mobile-pages { display: block; } .spacer { display: none; } header { padding: 0 16px; } h1 { font-size: 15px; } .toolbar { padding: 10px 12px; } #viewport { padding: 12px; } .info { padding: 12px 16px; } }

  #stage { position:relative; margin:0 auto; box-shadow:0 6px 24px #17171710; }
  #artboard { width:100%; height:100%; margin:0; border:0; box-shadow:none; }
  #hotspots { position:absolute; inset:0; pointer-events:none; }
  .hotspot { position:absolute; pointer-events:auto; border:2px solid transparent; border-radius:7px; }
  .hotspot:hover, .hotspot:focus-visible, .show-links .hotspot { border-color:#171717; background:#17171714; }
  .toolbar label { font-size:13px; }
</style>
</head>

  </main>
</div>

, "target": "UI-07b_买方预约与待确认", "label": "返回买方列表"}, {"x": 108, "y": 931, "width": 230, "height": 32, "target": "UI-07b_买方预约与待确认", "label": "返回对应交易列表 →"}, {"x": 768, "y": 931, "width": 230, "height": 32, "target": "UI-07a_卖方待答复预约", "label": "返回对应交易列表 →"}]}, {"id": "UI-07a_卖方待答复预约", "title": "卖方待答复预约列表", "width": 1440, "height": 1000, "note": "林同学的本人卖方预约；先列出所有尚未接受的预约，再选择一笔处理。", "svg": "UI设计源文件/修订_v0.2/UI-07a_卖方待答复预约.svg", "png": "UI界面/修订_v0.2/UI-07a_卖方待答复预约.png", "hotspots": [{"x": 80, "y": 100, "width": 180, "height": 32, "target": "UI-04_个人工作台", "label": "← 返回个人工作台"}, {"x": 1188, "y": 151, "width": 172, "height": 32, "target": "UI-07b_买方预约与待确认", "label": "切换买方列表 →"}, {"x": 1174, "y": 270, "width": 158, "height": 32, "target": "UI-07c_取消待答复订单", "label": "取消待答复 →"}, {"x": 1174, "y": 450, "width": 158, "height": 44, "target": "UI-08a_订单详情_待卖家接受", "label": "处理预约"}]}, {"id": "UI-07b_买方预约与待确认", "title": "买方预约与待确认列表", "width": 1440, "height": 1000, "note": "林同学的本人交易；等待卖家接受与等待方案确认分别标明。", "svg": "UI设计源文件/修订_v0.2/UI-07b_买方预约与待确认.svg", "png": "UI界面/修订_v0.2/UI-07b_买方预约与待确认.png", "hotspots": [{"x": 80, "y": 100, "width": 180, "height": 32, "target": "UI-04_个人工作台", "label": "← 返回个人工作台"}, {"x": 1188, "y": 151, "width": 172, "height": 32, "target": "UI-07a_卖方待答复预约", "label": "切换卖方列表 →"}, {"x": 1174, "y": 270, "width": 158, "height": 32, "target": "UI-07c_取消待答复订单", "label": "取消待答复 →"}, {"x": 1174, "y": 450, "width": 158, "height": 44, "target": "UI-08d_订单详情_等待卖家接受", "label": "查看预约"}, {"x": 1174, "y": 666, "width": 158, "height": 44, "target": "UI-08b_订单详情_确认方案", "label": "确认方案"}]}, {"id": "UI-07c_取消待答复订单", "title": "取消待答复：买方与卖方", "width": 1440, "height": 1000, "note": "取消申请的分支示例；林同学作为买方和卖方，都能从工作台及对应列表找到待答复订单。", "svg": "UI设计源文件/修订_v0.2/UI-07c_取消待答复订单.svg", "png": "UI界面/修订_v0.2/UI-07c_取消待答复订单.png", "hotspots": [{"x": 80, "y": 100, "width": 180, "height": 32, "target": "UI-04_个人工作台", "label": "← 返回个人工作台"}, {"x": 1174, "y": 414, "width": 158, "height": 44, "target": "UI-08v_取消协商变体", "lab const $=id=>document.getElementById(id);
let index=0;
try { const found=pages.findIndex(p=>p.id===decodeURIComponent(location.hash.slice(1))); if(found>=0)index=found; } catch(_){}
for(const [i,page] of pages.entries()){
  const button=document.createElement('button');button.type='button';button.className='page';
  const number=document.createElement('span');number.className='num';number.textContent=String(i+1).padStart(2,'0');
  const label=document.createElement('span');label.textContent=page.title;button.append(number,label);
  button.addEventListener('click',()=>show(i));$('pages').append(button);
  const option=document.createElement('option');option.value=i;option.textContent=`${i+1}. ${page.title}`;$('mobile-pages').append(option);
}
function resize(){
  const padding=innerWidth<=850?24:48;
  const page=pages[index];
  const scale=$('zoom').value==='fit'?Math.max(.1,($('viewport').clientWidth-padding)/page.width):Number($('zoom').value);
  $('stage').style.width=`${page.width*scale}px`;$('stage').style.height=`${page.height*scale}px`;
}
function show(i){
  index=Math.max(0,Math.min(pages.length-1,i));const page=pages[index];
  $('title').textContent=page.title;$('note').textContent=page.note||'沿用首轮已讨论的状态规则。';$('count').textContent=`${index+1} / ${pages.length}`;
  $('previous').disabled=index===0;$('next').disabled=index===pages.length-1;$('mobile-pages').value=index;
  [...$('pages').children].forEach((button,n)=>{button.classList.toggle('active',n===index);if(n===index)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
  const filename=page.id+'.png';$('error').style.display='none';$('stage').style.display='block';$('artboard').alt=page.title;$('artboard').src=filename;
  $('open-png').href=filename;$('open-svg').href='../../'+page.svg;
  $('hotspots').replaceChildren();
  for(const spot of page.hotspots){
    const a=document.createElement('a');a.className='hotspot';a.href='#'+encodeURIComponent(spot.target);a.title=spot.label;a.setAttribute('aria-label',spot.label);
    a.style.left=100*spot.x/page.width+'%';a.style.top=100*spot.y/page.height+'%';a.style.width=100*spot.width/page.width+'%';a.style.height=100*spot.height/page.height+'%';
    a.addEventListener('click',event=>{event.preventDefault();const next=pages.findIndex(p=>p.id===spot.target);if(next>=0)show(next);});$('hotspots').append(a);
  }
  $('viewport').scrollTop=0;$('viewport').scrollLeft=0;resize();history.replaceState(null,'','#'+encodeURIComponent(page.id));
}
$('previous').addEventListener('click',()=>show(index-1));$('next').addEventListener('click',()=>show(index+1));
$('workspace').addEventListener('click',()=>show(pages.findIndex(p=>p.id==='UI-04_个人工作台')));
$('mobile-pages').addEventListener('change',event=>show(Number(event.target.value)));$('zoom').addEventListener('change',resize);addEventListener('resize',resize);
$('show-links').addEventListener('change',event=>$('stage').classList.toggle('show-links',event.target.checked));
$('artboard').addEventListener('dblclick',()=>{$('zoom').value=$('zoom').value==='fit'?'1':'fit';resize();});
$('artboard').addEventListener('error',()=>{$('error').style.display='block';$('stage').style.display='none';});
addEventListener('keydown',event=>{if(event.target.matches('select,input,textarea'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();show(index+(event.key==='ArrowRight'?1:-1));}});
show(index);
</script>
